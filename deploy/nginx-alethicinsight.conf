# Alethic Insight 官网 — 腾讯云主站服务器块（nginx）
# 部署位置：/etc/nginx/sites-available/alethicinsight → sites-enabled 软链
# TLS：Cloudflare Origin CA 证书（15 年，免费，仅回源用）放在 /etc/nginx/ssl/；
#      Cloudflare 端 SSL/TLS 模式用 Full (strict)。A 记录指向本机公网 IP。

server {
    listen 80;
    server_name alethicinsight.com alethicinsight.cn alethicinsight.org
                aletheion.cn aletheion.org.cn;
    # ACME 之外全部跳 HTTPS
    location /.well-known/ { root /var/www/acme; }
    location / { return 301 https://alethicinsight.com$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name alethicinsight.com;

    ssl_certificate     /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin.key;

    root /var/www/alethicinsight/current;
    index index.html;

    # 静态站（多页 MPA）：直接按文件服务，404 落到自定义页（可选）
    location / {
        try_files $uri $uri/ =404;
    }

    # vite 指纹产物长缓存；HTML/JSON 短缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(html|json)$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
